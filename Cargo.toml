[package]
name = "herdfold"
version = "0.6.0"
edition = "2024"
description = "Long text, laid out as facing pages you turn: a book reader across two herdr panes, with bookmarks, notes and an agent to ask"
license = "MIT OR Apache-2.0"
repository = "https://github.com/azihsoyn/herdfold"
homepage = "https://github.com/azihsoyn/herdfold"
readme = "README.md"
keywords = ["tui", "reader", "epub", "markdown", "herdr"]
categories = ["command-line-utilities", "text-processing"]
exclude = ["demo/", "demo.gif", "assets/"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["use-dev-tty"] }
encoding_rs = "0.8.42"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp"] }
lopdf = "0.42.0"
pdf-extract = "0.12.1"
pulldown-cmark = { version = "0.13.4", default-features = false }
quick-xml = "0.41.0"
ratatui = "0.30.2"
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect = { version = "5.3.0", default-features = false, features = ["parsing", "regex-onig"] }
toml = "0.8.23"
toml_edit = "0.22.27"
two-face = { version = "0.5.2", default-features = false, features = ["syntect-onig"] }
unicode-normalization = "0.1"
unicode-width = "0.2.2"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
